<!DOCTYPE html>
<html>
<head>
    <title>Book Appointment</title>
</head>
<body>

<h1>Book Appointment</h1>

<form action="/book_appointment" method="POST">

    <input type="text"
           name="patient_name"
           placeholder="Patient Name"
           required>

    <br><br>

    <input type="text"
           name="doctor_name"
           placeholder="Doctor Name"
           required>

    <br><br>

    <input type="date"
           name="appointment_date"
           required>

    <br><br>

    <button type="submit">
        Book Appointment
    </button>

</form>

</body>
</html>
