</head>

<body>

<h1>👨‍⚕️ Doctors List</h1>

<table>

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Specialization</th>
    <th>Phone</th>
</tr>

{% for doctor in doctors %}

<tr>
    <td>{{ doctor[0] }}</td>
    <td>{{ doctor[1] }}</td>
    <td>{{ doctor[2] }}</td>
    <td>{{ doctor[3] }}</td>
</tr>

{% endfor %}

</table>
