</head>

<body>

<h1>💰 Hospital Bills</h1>

<table>

<tr>
    <th>ID</th>
    <th>Patient</th>
    <th>Treatment</th>
    <th>Amount</th>
</tr>

{% for bill in bills %}

<tr>
    <td>{{ bill[0] }}</td>
    <td>{{ bill[1] }}</td>
    <td>{{ bill[2] }}</td>
    <td class="amount">₹{{ bill[3] }}</td>
</tr>

{% endfor %}

</table>

</body>
