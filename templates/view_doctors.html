<!DOCTYPE html>
<html>
<head>
    <title>Doctors</title>

    <style>
        body{
            font-family:Arial, sans-serif;
            background:#f4f7fc;
            padding:30px;
        }

        h1{
            color:#1f3c88;
            margin-bottom:25px;
        }

        .grid{
            display:grid;
            grid-template-columns:repeat(auto-fill, minmax(250px,1fr));
            gap:25px;
        }

        .card{
            background:white;
            border-radius:15px;
            padding:20px;
            text-align:center;
            box-shadow:0 4px 15px rgba(0,0,0,0.1);
            transition:0.3s;
        }

        .card:hover{
            transform:translateY(-5px);
        }

        .avatar{
            width:90px;
            height:90px;
            border-radius:50%;
            background:#1f3c88;
            color:white;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:40px;
            margin:0 auto 15px;
        }

        .card h3{
            margin:10px 0 5px;
            color:#1f3c88;
        }

        .card p{
            color:#666;
            margin:5px 0;
        }
    </style>

</head>
<body>

<h1>👨‍⚕️ Doctors</h1>

<div class="grid">

{% for doctor in doctors %}
    <div class="card">
        <div class="avatar">👨‍⚕️</div>
        <h3>{{ doctor[1] }}</h3>
        <p><b>Specialization:</b> {{ doctor[2] }}</p>
        <p><b>Phone:</b> {{ doctor[3] }}</p>
    </div>
{% endfor %}

</div>

</body>
</html>
