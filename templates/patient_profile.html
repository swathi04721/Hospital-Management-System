<!DOCTYPE html>
<html>
<head>
    <title>Patient Profile</title>

    <style>

        body{
            font-family:Arial, sans-serif;
            background:#f4f7fc;
            padding:30px;
        }

        .profile-card{
            background:white;
            border-radius:15px;
            padding:25px;
            box-shadow:0 4px 15px rgba(0,0,0,0.1);
            margin-bottom:25px;
        }

        .profile-header{
            display:flex;
            align-items:center;
            gap:20px;
        }

        .avatar{
            width:90px;
            height:90px;
            border-radius:50%;
            background:#1f3c88;
            color:white;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:40px;
        }

        .profile-info h1{
            margin:0;
            color:#1f3c88;
        }

        .profile-info p{
            margin:8px 0;
            color:#555;
            font-size:16px;
        }

        .appointments{
            background:white;
            border-radius:15px;
            padding:25px;
            box-shadow:0 4px 15px rgba(0,0,0,0.1);
        }

        .appointments h2{
            color:#1f3c88;
            margin-top:0;
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        th{
            background:#1f3c88;
            color:white;
            padding:12px;
        }

        td{
            padding:12px;
            border-bottom:1px solid #eee;
            text-align:center;
        }

        tr:hover{
            background:#f8f9ff;
        }

        .status{
            background:#28a745;
            color:white;
            padding:5px 10px;
            border-radius:20px;
            font-size:14px;
        }

    </style>

</head>

<body>

<div class="profile-card">

    <div class="profile-header">

        <div class="avatar">
            👤
        </div>

        <div class="profile-info">
            <h1>{{ patient[1] }}</h1>
            <p><strong>Age:</strong> {{ patient[2] }}</p>
            <p><strong>Disease:</strong> {{ patient[3] }}</p>
        </div>

    </div>

</div>

<div class="appointments">

    <h2>📅 Appointment History</h2>

    <table>

        <tr>
            <th>ID</th>
            <th>Doctor</th>
            <th>Date</th>
            <th>Status</th>
        </tr>

        {% for appointment in appointments %}

        <tr>
            <td>{{ appointment[0] }}</td>
            <td>{{ appointment[2] }}</td>
            <td>{{ appointment[3] }}</td>
            <td>
                <span class="status">
                    {{ appointment[4] }}
                </span>
            </td>
        </tr>

        {% endfor %}

    </table>

</div>

</body>
</html>
