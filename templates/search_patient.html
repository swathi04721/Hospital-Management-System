<!DOCTYPE html>
<html>
<head>
    <title>Search Patient</title>

    <style>

        body{
            font-family:Arial, sans-serif;
            background:#f4f7fc;
            padding:30px;
        }

        .container{
            background:white;
            padding:25px;
            border-radius:15px;
            box-shadow:0 4px 15px rgba(0,0,0,0.1);
            margin-bottom:25px;
        }

        h1{
            color:#1f3c88;
            margin-top:0;
        }

        form{
            display:flex;
            gap:10px;
        }

        input{
            flex:1;
            padding:12px;
            border:1px solid #ddd;
            border-radius:8px;
            font-size:15px;
        }

        button{
            padding:12px 20px;
            background:#1f3c88;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-size:15px;
        }

        button:hover{
            background:#3056b3;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
            border-radius:15px;
            overflow:hidden;
            box-shadow:0 4px 15px rgba(0,0,0,0.1);
        }

        th{
            background:#1f3c88;
            color:white;
            padding:15px;
        }

        td{
            padding:12px;
            text-align:center;
            border-bottom:1px solid #eee;
        }

        tr:hover{
            background:#f8f9ff;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>🔍 Search Patient</h1>

    <form method="POST">

        <input
            type="text"
            name="keyword"
            placeholder="Enter Patient Name"
            required>

        <button type="submit">
            Search
        </button>

    </form>

</div>

<table>

    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Age</th>
        <th>Disease</th>
    </tr>

    {% for patient in patients %}

    <tr>
        <td>{{ patient[0] }}</td>
        <td>{{ patient[1] }}</td>
        <td>{{ patient[2] }}</td>
        <td>{{ patient[3] }}</td>
    </tr>

    {% endfor %}

</table>

</body>
</html>
