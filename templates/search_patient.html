<!DOCTYPE html>
<html>
<head>
    <title>Search Patient</title>
</head>
<body>

<h1>Search Patient</h1>

<form method="POST">

    <input type="text"
           name="keyword"
           placeholder="Enter Patient Name">

    <button type="submit">
        Search
    </button>

</form>

<br>

<table border="1">

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Age</th>
    <th>Disease</th>
</tr>

{% for patient in patients %}

<tr>
    <td>{{ patient[0] }}</td>
    <td>{{ patient[1] }}</td>
    <td>{{ patient[2] }}</td>
    <td>{{ patient[3] }}</td>
</tr>

{% endfor %}

</table>

</body>
</html>
