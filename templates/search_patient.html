<!DOCTYPE html>
<html>
<head>
    <title>Search Patient</title>

    <style>

        body{
            font-family:Arial;
            background:#f4f6f9;
            padding:20px;
        }

        h1{
            color:#2c3e50;
        }

        form{
            margin-bottom:20px;
        }

        input{
            padding:10px;
            width:300px;
        }

        button{
            padding:10px 15px;
            background:#2c3e50;
            color:white;
            border:none;
            cursor:pointer;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
        }

        th{
            background:#2c3e50;
            color:white;
            padding:10px;
        }

        td{
            padding:10px;
            border:1px solid #ddd;
            text-align:center;
        }

    </style>

</head>
<body>

<h1>Search Patient</h1>

<form method="POST">

    <input
        type="text"
        name="keyword"
        placeholder="Enter Patient Name"
        required>

    <button type="submit">
        Search
    </button>

</form>

<table>

    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Age</th>
        <th>Disease</th>
    </tr>

    {% for patient in patients %}

    <tr>
        <td>{{ patient[0] }}</td>
        <td>{{ patient[1] }}</td>
        <td>{{ patient[2] }}</td>
        <td>{{ patient[3] }}</td>
    </tr>

    {% endfor %}

</table>

</body>
</html>
