<!DOCTYPE html>
<html>
<head>
    <title>Hospital Dashboard</title>

    <style>

        body{
            margin:0;
            font-family:Arial;
            background:#f4f6f9;
        }

        .sidebar{
            width:220px;
            height:100vh;
            background:#2c3e50;
            position:fixed;
            color:white;
            padding-top:20px;
        }

        .sidebar h2{
            text-align:center;
        }

        .sidebar a{
            display:block;
            color:white;
            padding:15px;
            text-decoration:none;
        }

        .sidebar a:hover{
            background:#34495e;
        }

        .main{
            margin-left:220px;
            padding:30px;
        }

        .cards{
            display:flex;
            gap:20px;
            margin-top:30px;
        }

        .card{
            background:white;
            padding:25px;
            width:250px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        .card h3{
            color:#7f8c8d;
        }

        .card h1{
            color:#2c3e50;
        }

    </style>

</head>

<body>

<div class="sidebar">

    <h2>Hospital</h2>

    <a href="/dashboard">Dashboard</a>

    <a href="/patients">Add Patient</a>
    <a href="/appointments">Book Appointment</a>
    <a href="/view_appointments">View Appointments</a>
    <a href="/view_patients">View Patients</a>
    <a href="/doctors">Add Doctor</a>
    <a href="/view_doctors">View Doctors</a>
</div>

<div class="main">

    <h1>Hospital Dashboard</h1>
<div class="cards">

    <div class="card">
        <h3>Total Patients</h3>
        <h1>{{ total_patients }}</h1>
    </div>

    <div class="card">
        <h3>Total Appointments</h3>
        <h1>{{ total_appointments }}</h1>
    </div>

    <div class="card">
        <h3>Completed Appointments</h3>
        <h1>{{ completed_appointments }}</h1>
    </div>

</div>
    
</div>         

</body>
</html>
