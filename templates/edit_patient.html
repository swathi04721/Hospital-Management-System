<!DOCTYPE html>
<html>

<head>
    <title>View Patients</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<h1>🩺 Patient Records</h1>

<table border="1" align="center" cellpadding="10">

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Age</th>
    <th>Disease</th>
    <th>Phone</th>
    <th>Action</th>
</tr>

{% for patient in patients %}

<tr>

    <td>{{ patient[0] }}</td>
    <td>{{ patient[1] }}</td>
    <td>{{ patient[2] }}</td>
    <td>{{ patient[3] }}</td>
    <td>{{ patient[4] }}</td>

    <td>

        <a href="/edit_patient/{{ patient[0] }}">
            <button>Edit</button>
        </a>

        <a href="/delete_patient/{{ patient[0] }}">
            <button>Delete</button>
        </a>

    </td>

</tr>

{% endfor %}

</table>

</body>
</html>
