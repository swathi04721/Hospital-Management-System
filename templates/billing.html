<!DOCTYPE html>
<html>
<head>
    <title>Create Bill</title>
</head>
<body>

<h1>Create Bill</h1>

<form action="/add_bill" method="POST">

    <input type="text"
           name="patient_name"
           placeholder="Patient Name"
           required>

    <br><br>

    <input type="text"
           name="treatment"
           placeholder="Treatment"
           required>

    <br><br>

    <input type="number"
           step="0.01"
           name="amount"
           placeholder="Amount"
           required>

    <br><br>

    <button type="submit">
        Save Bill
    </button>

</form>

</body>
</html>
