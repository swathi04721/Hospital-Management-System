<!DOCTYPE html>
<html>
<head>
    <title>Create Bill</title>

    <style>

        body{
            font-family:Arial, sans-serif;
            background:#f4f7fc;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            background:white;
            padding:40px;
            width:400px;
            border-radius:15px;
            box-shadow:0 4px 15px rgba(0,0,0,0.1);
        }

        h1{
            text-align:center;
            color:#1f3c88;
            margin-bottom:25px;
        }

        input{
            width:100%;
            padding:12px;
            margin-bottom:15px;
            border:1px solid #ddd;
            border-radius:8px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:12px;
            background:#1f3c88;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#3056b3;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>💰 Create Bill</h1>

    <form action="/add_bill" method="POST">

        <input type="text"
               name="patient_name"
               placeholder="Patient Name"
               required>

        <input type="text"
               name="treatment"
               placeholder="Treatment"
               required>

        <input type="number"
               step="0.01"
               name="amount"
               placeholder="Amount"
               required>

        <button type="submit">
            Save Bill
        </button>

    </form>

</div>

</body>
</html>
