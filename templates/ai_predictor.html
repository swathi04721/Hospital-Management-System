<!DOCTYPE html>
<html>
<head>
    <title>AI Disease Predictor</title>

    <style>

        body{
            font-family:Arial;
            background:#f4f7fc;
            padding:40px;
        }

        .box{
            background:white;
            padding:30px;
            border-radius:15px;
            max-width:700px;
            margin:auto;
            box-shadow:0 4px 15px rgba(0,0,0,0.1);
        }

        h1{
            color:#1f3c88;
        }

        textarea{
            width:100%;
            padding:12px;
            border:1px solid #ddd;
            border-radius:8px;
        }

        button{
            margin-top:15px;
            padding:12px 20px;
            background:#1f3c88;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
        }

        .result{
            margin-top:20px;
            padding:15px;
            background:#e8f5e9;
            border-radius:8px;
            font-size:18px;
        }

    </style>

</head>

<body>

<div class="box">

    <h1>🤖 AI Disease Predictor</h1>

    <form action="/predict_disease" method="POST">

        <textarea
            name="symptoms"
            rows="5"
            placeholder="Enter symptoms (Example: fever, cough, headache)"
            required></textarea>

        <button type="submit">
            Predict Disease
        </button>

    </form>

    {% if prediction %}

    <div class="result">
        Predicted Disease: <b>{{ prediction }}</b>
    </div>

    {% endif %}

</div>

</body>
</html>
