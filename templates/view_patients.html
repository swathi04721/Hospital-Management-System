<!DOCTYPE html>
<html>

<head>

<title>Patient Records</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container">

<h1>Patient Records</h1>

<table>

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Age</th>
    <th>Disease</th>
</tr>

{% for patient in patients %}

<tr>

<td>{{ patient[0] }}</td>
<td>{{ patient[1] }}</td>
<td>{{ patient[2] }}</td>
<td>{{ patient[3] }}</td>

</tr>

{% endfor %}

</table>

</div>

</body>
</html>
