<!DOCTYPE html>
<html>
<head>
    <title>Patient Records</title>

    <style>
        body{
            font-family: Arial;
            background:#f4f6f9;
            margin:0;
            padding:0;
        }

        .container{
            width:90%;
            margin:auto;
            margin-top:40px;
        }

        h1{
            text-align:center;
            color:#2c3e50;
        }

        .top-bar{
            display:flex;
            justify-content:space-between;
            margin-bottom:20px;
        }

        input{
            padding:10px;
            width:250px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        .btn{
            padding:10px 15px;
            border:none;
            border-radius:5px;
            color:white;
            text-decoration:none;
            cursor:pointer;
        }

        .add-btn{
            background:green;
        }

        .edit-btn{
            background:#3498db;
        }

        .delete-btn{
            background:red;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
            box-shadow:0px 0px 10px rgba(0,0,0,0.1);
        }

        th, td{
            padding:15px;
            text-align:center;
            border-bottom:1px solid #ddd;
        }

        th{
            background:#2c3e50;
            color:white;
        }

        tr:hover{
            background:#f1f1f1;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Patient Records</h1>

    <div class="top-bar">
        <a href="/add_patient" class="btn add-btn">Add Patient</a>

        <input type="text" placeholder="Search Patient...">
    </div>

    <table>

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Disease</th>
            <th>Phone</th>
            <th>Action</th>
        </tr>

        {% for patient in patients %}

        <tr>
            <td>{{ patient[0] }}</td>
            <td>{{ patient[1] }}</td>
            <td>{{ patient[2] }}</td>
            <td>{{ patient[3] }}</td>
            <td>{{ patient[4] }}</td>

            <td>
                <a href="/edit/{{ patient[0] }}" class="btn edit-btn">Edit</a>

                <a href="/delete/{{ patient[0] }}" class="btn delete-btn">Delete</a>
            </td>
        </tr>

        {% endfor %}

    </table>

</div>

</body>
</html>
