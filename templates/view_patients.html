<!DOCTYPE html>
<html>
<head>
    <title>Patient Records</title>

    <style>
        body{
            font-family: Arial;
            background:#f4f6f9;
            margin:0;
            padding:30px;
        }

        h1{
            color:#2c3e50;
            margin-bottom:20px;
        }

        .top-bar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:20px;
        }

        input{
            padding:10px;
            width:250px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
        }

        th{
            background:#3498db;
            color:white;
            padding:12px;
        }

        td{
            padding:12px;
            text-align:center;
            border-bottom:1px solid #ddd;
        }

        tr:hover{
            background:#f1f1f1;
        }

        .btn{
            padding:7px 12px;
            border:none;
            border-radius:5px;
            color:white;
            cursor:pointer;
            text-decoration:none;
        }

        .edit{
            background:orange;
        }

        .delete{
            background:red;
        }

        .add-btn{
            background:green;
            padding:10px 15px;
        }
    </style>
</head>

<body>

    <div class="top-bar">
        <h1>Patient Records</h1>

        <input type="text" placeholder="Search Patient...">

        <a href="/dashboard" class="btn add-btn">Dashboard</a>
    </div>

    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Disease</th>
            <th>Phone</th>
            <th>Action</th>
        </tr>

        {% for patient in patients %}
        <tr>
            <td>{{ patient[0] }}</td>
            <td>{{ patient[1] }}</td>
            <td>{{ patient[2] }}</td>
            <td>{{ patient[3] }}</td>
            <td>{{ patient[4] }}</td>

            <td>
                <a href="/edit/{{ patient[0] }}" class="btn edit">Edit</a>

                <a href="/delete/{{ patient[0] }}" class="btn delete">
                    Delete
                </a>
            </td>
        </tr>
        {% endfor %}

    </table>

</body>
</html>
