<!DOCTYPE html>
<html>
<head>
    <title>View Patients</title>

    <style>
        body{
            font-family:Arial;
            background:#f4f6f9;
            padding:20px;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
        }

        th{
            background:#2c3e50;
            color:white;
            padding:12px;
        }

        td{
            padding:10px;
            border:1px solid #ddd;
            text-align:center;
        }

        a{
            text-decoration:none;
            padding:6px 10px;
            border-radius:5px;
        }

        .delete{
            background:red;
            color:white;
        }

        .profile{
            background:green;
            color:white;
        }
    </style>

</head>
<body>

<h1>Patient Records</h1>

<table>

<tr>
    <th>ID</th>
    <th>Name</th>
    <th>Age</th>
    <th>Disease</th>
    <th>Profile</th>
    <th>Delete</th>
</tr>

{% for patient in patients %}

<tr>

    <td>{{ patient[0] }}</td>
    <td>{{ patient[1] }}</td>
    <td>{{ patient[2] }}</td>
    <td>{{ patient[3] }}</td>

    <td>
        <a class="profile"
           href="/patient_profile/{{ patient[0] }}">
           View Profile
        </a>
    </td>

    <td>
        <a class="delete"
           href="/delete/{{ patient[0] }}">
           Delete
        </a>
    </td>

</tr>

{% endfor %}

</table>

</body>
</html>
